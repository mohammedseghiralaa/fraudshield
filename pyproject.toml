[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fraudshield"
version = "0.0.1"
description = "Fraud detection on imbalanced data: model comparison, threshold tuning, SHAP explainability"
authors = [
  { name = "alaeddine" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["fraudshield"]
include = ["pyproject.toml", "fraudshield/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["fraudshield"]
force-sort-within-sections = true

